<svg xmlns="http://www.w3.org/2000/svg" width="640" height="402" viewBox="0 0 640 402" role="img" aria-labelledby="title description">
  <title id="title">DGP 逐层注入流程</title>
  <desc id="description">图像经冻结的 ViT 编码一次。各层 CLS 进入路由器，产生用于融合各层 patch 的权重；语言模型执行每个 block 前先把投影后的融合结果加到视觉位置。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l9 5-9 5z" fill="#526982"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="400" rx="18" fill="#f5f8fc" stroke="#cfdaea" stroke-width="2"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#142941" text-anchor="middle" dominant-baseline="middle">
    <text x="320" y="26" font-size="20" font-weight="650">图像 → ViT 编码（一次）</text>
    <g stroke-width="1.5">
      <rect x="26" y="49" width="274" height="52" rx="8" fill="#e2eeff" stroke="#8eafd6"/>
      <rect x="340" y="49" width="274" height="52" rx="8" fill="#e6f4ee" stroke="#80b5a3"/>
      <rect x="16" y="114" width="608" height="270" rx="13" fill="#fff" stroke="#9eb2c8" stroke-dasharray="6 5"/>
      <rect x="34" y="170" width="250" height="55" rx="8" fill="#e2eeff" stroke="#8eafd6"/>
      <rect x="356" y="170" width="250" height="55" rx="8" fill="#e6f4ee" stroke="#80b5a3"/>
      <rect x="190" y="253" width="416" height="43" rx="8" fill="#e6f4ee" stroke="#80b5a3"/>
      <rect x="190" y="323" width="416" height="43" rx="8" fill="#edf0f7" stroke="#9eb2c8"/>
    </g>
    <g fill="none" stroke="#526982" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M159 101v68"/>
      <path d="M481 101v68"/>
      <path d="M285 198h69"/>
      <path d="M481 226v25"/>
      <path d="M481 297v24"/>
    </g>
    <g font-size="21" font-weight="600">
      <text x="163" y="76">各层 CLS 摘要</text>
      <text x="477" y="76">各层 patch 特征</text>
      <text x="159" y="192">glimpse 查各层摘要</text>
      <text x="481" y="192">按 patch 位置加权</text>
      <text x="398" y="275">投影后，门控加到视觉位置</text>
      <text x="398" y="346">执行当前 block 的自注意力</text>
    </g>
    <g font-size="16" fill="#304b65">
      <text x="320" y="140">生成时仅在 prefill：每个 LLM block 前重复</text>
      <text x="159" y="214">query 取上一层（或初始嵌入）</text>
      <text x="481" y="214">所有位置共用这组权重</text>
      <text x="320" y="182">权重</text>
    </g>
  </g>
</svg>
